<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetShift Link | GreenVital</title>
    <meta
      name="description"
      content="Open a PetShift link and continue in the app."
    />
    <link rel="stylesheet" href="/petshift-bridge.css" />
  </head>
  <body>
    <main class="bridge-shell">
      <section class="bridge-panel">
        <div class="brand"><span class="brand-mark"></span>PetShift by GreenVital</div>
        <h1 data-bridge-title>Open your invite</h1>
        <p data-bridge-copy>
          We are opening PetShift so you can accept this invite. If the app does not
          open automatically, use the button below.
        </p>
        <div class="bridge-actions">
          <a class="button button-primary" href="#" data-open-app>Open PetShift</a>
          <a class="button" href="/">Back to GreenVital</a>
        </div>
      </section>
    </main>
    <script src="/petshift-bridge.js"></script>
  </body>
</html>
