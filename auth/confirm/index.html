<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm PetShift Account | GreenVital</title>
    <meta
      name="description"
      content="Confirm your PetShift account and continue in the app."
    />
    <link rel="stylesheet" href="/petshift-bridge.css?v=auth-handoff-1" />
  </head>
  <body>
    <main class="bridge-shell">
      <section class="bridge-panel">
        <div class="brand"><span class="brand-mark"></span>PetShift</div>
        <p class="bridge-kicker">Email confirmation</p>
        <h1 data-bridge-title>Email confirmed</h1>
        <p data-bridge-copy>
          Your email address is confirmed. Continue in PetShift to finish setting up
          your account.
        </p>
        <div class="bridge-actions">
          <a class="button button-primary" href="#" data-open-app>Continue in PetShift</a>
          <a class="button" href="/petshift/">PetShift home</a>
        </div>
        <p class="bridge-note">PetShift opens only after you choose Continue.</p>
      </section>
    </main>
    <script src="/petshift-bridge.js?v=auth-handoff-1"></script>
  </body>
</html>
